user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    # Firewall a nivel capa 7: zonas de rate limiting (DENTRO del bloque http!)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5000r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Configuración básica
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # Headers de seguridad (Firewall / Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=3600" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Tamaño máximo de body
    client_max_body_size 50M;
    reset_timedout_connection on;

    # =============
    # UPSTREAMS - BALANCEADORES DE CARGA
    # =============

    # FastAPI cluster (balanceo round-robin)
    upstream api_cluster {
        least_conn;
        server api_backend:8000 max_fails=3 fail_timeout=30s;
        server api_backend_2:8000 max_fails=3 fail_timeout=30s backup;
    }

    # Flask cluster (balanceo round-robin)
    upstream flask_cluster {
        least_conn;
        server flask_user:5000 max_fails=3 fail_timeout=30s;
        server flask_user_2:5000 max_fails=3 fail_timeout=30s backup;
    }

    # Laravel backend
    upstream laravel_backend {
        server laravel_admin:80 max_fails=3 fail_timeout=30s;
    }

    # Prometheus (acceso restringido)
    upstream prometheus_backend {
        server prometheus:9090;
    }

    # Grafana (acceso por subruta)
    upstream grafana_backend {
        server grafana:3000;
    }

    # Incluir hosts virtuales
    include /etc/nginx/conf.d/*.conf;
}
