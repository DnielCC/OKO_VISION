# ================================
# REDIRECT HTTP -> HTTPS (PÚBLICO)
# ================================
server {
    listen 80;
    server_name _;

    # Location especial para healthcheck (sin redirect, responde directo!)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"OKO VISION GATEWAY","version":"2.0.0"}';
    }

    # Todo lo demas: 301 -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ================================
# HTTPS PRINCIPAL - PÚBLICO
# ================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # -------- SSL CONFIGURATION --------
    ssl_certificate     /etc/nginx/ssl/okovision.crt;
    ssl_certificate_key /etc/nginx/ssl/okovision.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # -------- FIREWALL: Rate Limiting --------
    # Limitar conexiones simultáneas por IP
    limit_conn conn_limit 50;

    # Tiempos de timeout (evitar slowloris)
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          10s;
    keepalive_timeout     15s;

    # Lista negra simple: bloquear User-Agents sospechosos
    if ($http_user_agent ~* (nmap|nikto|sqlmap|masscan|dirbuster|hydra|havij|zgrab|brutus) ) {
        return 403;
    }

    # Bloquear métodos no permitidos excepto los necesarios
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }

    # ============================================
    # RUTA 1: DASHBOARD ADMINISTRADOR (LARAVEL)
    # /, /login, /usuarios, /reportes, /alertas...
    # ============================================
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://laravel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ============================================
    # RUTA 2: API FASTAPI (PÚBLICO - PROTEGIDA JWT)
    # /api/*    -> FastAPI con rate-limit más estricto
    # ============================================
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://api_cluster/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ============================================
    # RUTA 3: FLASK USER (PÁGINAS WEB + API MÓVIL)
    # /flask/*  -> Portal Usuario Web
    # /user/*   -> Portal Usuario Web
    # /mobile/* -> API para App Móvil
    # ============================================
    location /flask/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://flask_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://flask_cluster/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # RUTA 4: ENDPOINTS FLASK JSON PARA APP MÓVIL
    # /mobile-api/* -> Reenvía a /flask/api/* de Flask
    # ============================================
    location /mobile-api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://flask_cluster/flask/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # RUTA 5: GRAFANA (MONITOREO) - Acceso Restringido
    # ============================================
    location /grafana/ {
        limit_req zone=api_limit burst=30 nodelay;

        # Simple firewall: en producción se usaría auth basic o IP whitelist
        # Para demo está abierto internamente
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # RUTA 6: PROMETHEUS - Acceso restringido
    # ============================================
    location /prometheus/ {
        # En producción: IP whitelist o Basic Auth
        allow 127.0.0.1;
        allow 172.0.0.0/8;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass http://prometheus_backend;
        proxy_set_header Host $host;
    }

    # ============================================
    # ENDPOINT PÚBLICO DE SALUD
    # ============================================
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"OKO VISION GATEWAY","version":"2.0.0"}';
    }

    # ============================================
    # STATUS NGINX (MONITOREO INTERNO)
    # ============================================
    location = /nginx-status {
        allow 127.0.0.1;
        allow 172.0.0.0/8;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        stub_status on;
        access_log off;
    }

    # Páginas de error personalizadas
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        default_type application/json;
        return 500 '{"error":"Internal Server Error","code":500}';
    }
    location = /403.html {
        default_type application/json;
        return 403 '{"error":"Access Denied","code":403}';
    }
    location = /404.html {
        default_type application/json;
        return 404 '{"error":"Not Found","code":404}';
    }
    location = /429.html {
        default_type application/json;
        return 429 '{"error":"Too Many Requests - Try again later","code":429}';
    }
}
