global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'oko-vision-monitor'
    environment: 'production'

# Alertmanager (para futuro)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Reglas de grabación/alertas
rule_files:
  # - "alerts/*.yml"

scrape_configs:
  # Prometheus monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  # Métricas del sistema host
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          service: 'node_exporter'
          tier: 'monitoring'

  # Métricas de contenedores Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          tier: 'monitoring'

  # FastAPI - Backend API 1
  - job_name: 'fastapi-backend-1'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api_backend:8000']
        labels:
          service: 'fastapi'
          instance: 'api-1'
          tier: 'backend'

  # FastAPI - Backend API 2 (réplica)
  - job_name: 'fastapi-backend-2'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api_backend_2:8000']
        labels:
          service: 'fastapi'
          instance: 'api-2'
          tier: 'backend'

  # Flask - User Portal 1
  - job_name: 'flask-portal-1'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flask_user:5000']
        labels:
          service: 'flask'
          instance: 'flask-1'
          tier: 'backend'

  # Flask - User Portal 2 (réplica)
  - job_name: 'flask-portal-2'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flask_user_2:5000']
        labels:
          service: 'flask'
          instance: 'flask-2'
          tier: 'backend'

  # PostgreSQL via pg_exporter (si lo tenemos en futuro)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres_exporter:9187']

  # Nginx status - stub status
  - job_name: 'nginx-gateway'
    metrics_path: '/nginx-status'
    static_configs:
      - targets: ['nginx_gateway:80']
        labels:
          service: 'nginx'
          instance: 'gateway'
          tier: 'proxy'
